version: "2"

run:
  modules-download-mode: 'readonly'

linters:
  enable:
    - 'asciicheck'
    - 'bodyclose'
    - 'dogsled'
    - 'errcheck'
    - 'errorlint'
    - 'copyloopvar'
    - 'goheader'
    - 'gomodguard'
    - 'goprintffuncname'
    - 'gosec'
    - 'govet'
    - 'ineffassign'
    - 'makezero'
    - 'misspell'
    - 'noctx'
    - 'paralleltest'
    - 'prealloc'
    - 'predeclared'
    - 'revive'
    - 'sqlclosecheck'
    - 'staticcheck'
    - 'unconvert'
    - 'unused'
    - 'whitespace'
  settings:
    gosec:
      excludes:
        - G304  # File path from variable — intentional for this CLI tool
        - G117  # Password in struct — needed for Docker auth
    staticcheck:
      checks:
        - all
        - '-SA1019'  # Deprecated API — TODO: migrate to docker.New()
  exclusions:
    paths:
      - 'assets'

formatters:
  enable:
    - 'gofumpt'
    - 'goimports'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
